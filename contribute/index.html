<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add a spec · CK-12</title><link rel="stylesheet" href="form.css"><script defer src="../specs.js"></script><script defer src="model.js?v=2"></script><script defer src="published.js?v=f209a3fac474"></script><script defer src="direct.js"></script><script defer src="copy.js"></script></head><body><main><nav><a href="../">← Diagram Style Guide</a> · <a href="https://github.com/zehralokhandwala-ck12/ck12-design-guide/commits/main/contribute/published.js">Change history</a></nav><h1>Add a spec</h1><form id="editor"><fieldset><legend>Where does it belong?</legend><div class="pair"><label>Subject<select id="subject"></select></label><label>Category<select id="category"></select></label></div><label id="newcat">New category name<input id="catname" maxlength="100"></label><label>Diagram or graph type<select id="entry"></select></label><label id="namebox">New type name<input id="name" maxlength="100"></label></fieldset><fieldset><legend>Specifications</legend><label>Applies to<input id="scope" placeholder="All grades, Grade 6, or a particular case" maxlength="180"></label><div id="rows"></div><button class="plain" type="button" id="add">+ Add property</button></fieldset><fieldset><legend>Reference screenshot</legend><label>Image (optional, up to 450 KB)<input id="image" type="file" accept="image/png,image/jpeg,image/webp"></label><label>Caption<input id="caption" maxlength="300"></label></fieldset><details><summary>Editor access</summary><p>Use your own GitHub access token with Contents write access to this repository. Your password manager can fill it next time.</p><label>Editor token<input id="key" type="password" autocomplete="off"></label></details><button class="primary" id="submit">Submit spec</button></form><p role="status" id="status"></p><a hidden id="result">Open the spec</a></main></body></html>
