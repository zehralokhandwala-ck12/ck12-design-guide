<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CK-12 Diagram Style Guide</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#008545;--green-dark:#005D30;--green-light:#e8f5ee;--green-pale:#f2faf6;
  --indigo:#5750E3;--indigo-dark:#3D389F;--indigo-light:#eeeeff;
  --orange:#FF7B00;--orange-dark:#B25600;--orange-light:#fff5e6;
  --bg:#f4f5f7;--surface:#fff;--surface2:#f0f1f4;--border:#e3e5ea;--border2:#cdd0d8;
  --text:#1a1d23;--text-mid:#44485a;--text-muted:#737885;--text-dim:#aeb3be;
  --warn-bg:#fff5e6;--warn-border:#ffd9a8;
  --info-bg:#eeeeff;--info-border:#c5c3f5;
  --note-bg:#f6f7f9;--note-border:#e3e5ea;
  --math-color:#008545;--math-bg:#e8f5ee;
  --bio-color:#00783E;--bio-bg:#e0f2e9;
  --phys-color:#5750E3;--phys-bg:#eeeeff;
  --chem-color:#B25600;--chem-bg:#fff5e6;
  --mono:'DM Mono',monospace;--sans:'Inter',sans-serif;
  --r:8px;--sh:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);--sh-md:0 4px 12px rgba(0,0,0,.09);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{background:var(--bg);color:var(--text);font-family:var(--sans);height:100vh;display:flex;overflow:hidden}
#sidebar{width:268px;min-width:268px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--sh)}
.sidebar-brand{padding:14px 16px 12px;border-bottom:1px solid var(--border)}
.brand-logo{display:flex;align-items:center;gap:10px;margin-bottom:6px;cursor:pointer;text-decoration:none}
.brand-logo:hover .brand-title{color:var(--green)}
.brand-title{font-size:13px;font-weight:700;color:var(--text);line-height:1.2;transition:color .15s}
.brand-sub{font-size:11px;color:var(--text-muted)}
.brand-version{display:inline-block;font-size:10px;font-family:var(--mono);background:var(--green-light);color:var(--green-dark);padding:2px 7px;border-radius:10px;margin-top:5px}
.search-wrap{padding:10px 12px;border-bottom:1px solid var(--border);position:relative}
.search-icon{position:absolute;left:22px;top:50%;transform:translateY(-50%);color:var(--text-dim);pointer-events:none;font-size:14px}
#search-input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--sans);font-size:12.5px;padding:7px 28px 7px 30px;outline:none;transition:border-color .15s,box-shadow .15s}
#search-input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,133,69,.12)}
#search-input::placeholder{color:var(--text-dim)}
.search-clear{position:absolute;right:20px;top:50%;transform:translateY(-50%);color:var(--text-muted);cursor:pointer;font-size:11px;display:none;width:16px;height:16px;border-radius:50%;background:var(--border2);align-items:center;justify-content:center}
.search-clear.vis{display:flex}
#nav{overflow-y:auto;flex:1;padding:6px 0 16px}
#nav::-webkit-scrollbar{width:3px}
#nav::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.nav-group{margin-bottom:1px}
.nav-group-btn{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:background .1s}
.nav-group-btn:hover{background:var(--bg)}
.nav-icon{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;font-weight:700}
.nav-group-label{font-size:12px;font-weight:600;color:var(--text-mid);flex:1}
.nav-group-count{font-size:10px;color:var(--text-dim);font-family:var(--mono)}
.nav-chevron{font-size:10px;color:var(--text-dim);transition:transform .2s;margin-left:2px}
.nav-group.open .nav-chevron{transform:rotate(90deg)}
.nav-items{display:none}
.nav-group.open .nav-items{display:block}
.nav-item{display:flex;align-items:center;gap:6px;padding:5px 14px 5px 44px;cursor:pointer;color:var(--text-muted);font-size:12.5px;border-left:2px solid transparent;transition:all .1s;user-select:none}
.nav-item:hover{color:var(--text);background:var(--bg)}
.nav-item.active{color:var(--green);border-left-color:var(--green);background:var(--green-pale);font-weight:500}
.nav-warn-dot{width:5px;height:5px;border-radius:50%;background:var(--orange);margin-left:auto;flex-shrink:0}
.nav-item.nh,.nav-group.nh{display:none}
#main{flex:1;overflow-y:auto}
#main::-webkit-scrollbar{width:5px}
#main::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.sticky-bar{position:sticky;top:0;z-index:20;background:rgba(244,245,247,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:11px 28px;display:flex;align-items:center;gap:10px}
.breadcrumb{font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:5px;flex:1}
.breadcrumb span{color:var(--text);font-weight:500}
.subject-badge{font-size:10px;font-weight:600;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
.badge-math{background:var(--math-bg);color:var(--math-color)}
.badge-biology{background:var(--bio-bg);color:var(--bio-color)}
.badge-physics{background:var(--phys-bg);color:var(--phys-color)}
.badge-chemistry{background:var(--chem-bg);color:var(--chem-color)}
.content-area{padding:22px 28px 60px;max-width:820px}
/* Downloads */
.dl-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;box-shadow:var(--sh)}
.dl-section-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px;color:var(--text-mid)}
.dl-group{margin-bottom:10px}
.dl-group:last-child{margin-bottom:0}
.dl-group-label{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px}
.dl-group-label.math-label{color:var(--math-color)}
.dl-group-label.bio-label{color:var(--bio-color)}
.dl-group-label.phys-label{color:var(--phys-color)}
.dl-group-label.chem-label{color:var(--chem-color)}
.dl-row{display:flex;flex-wrap:wrap;gap:6px}
.dl-btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:6px;font-size:12px;font-weight:500;font-family:var(--sans);cursor:pointer;text-decoration:none;border:1.5px solid var(--border);background:var(--surface);color:var(--text-mid);transition:all .15s;white-space:nowrap}
.dl-btn:hover{background:var(--bg);border-color:var(--border2);color:var(--text)}
.dl-btn .dl-icon{font-size:13px;flex-shrink:0}
/* Cards */
.spec-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden;box-shadow:var(--sh);transition:box-shadow .15s}
.spec-card:hover{box-shadow:var(--sh-md)}
.card-header{padding:11px 16px 9px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.card-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.card-title{font-size:13px;font-weight:600;flex:1}
.grade-pill{font-size:9px;font-family:var(--mono);font-weight:500;padding:2px 6px;border-radius:3px;background:var(--green-light);color:var(--green-dark);border:1px solid #a8d9be}
.card-body{padding:13px 16px}
/* Images */
.img-gallery{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.img-item{display:flex;flex-direction:column;gap:5px}
.img-item img{border-radius:6px;border:1px solid var(--border);object-fit:contain;background:var(--surface2);max-width:340px;max-height:220px;cursor:zoom-in;transition:box-shadow .15s}
.img-item img:hover{box-shadow:var(--sh-md)}
.img-caption{font-size:10.5px;color:var(--text-muted);text-align:center;font-style:italic}
/* Lightbox */
#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:1000;align-items:center;justify-content:center;cursor:zoom-out}
#lightbox.show{display:flex}
#lightbox img{max-width:90vw;max-height:90vh;border-radius:8px;object-fit:contain}
#lightbox-close{position:absolute;top:20px;right:24px;color:white;font-size:28px;cursor:pointer;line-height:1}
/* Spec table */
.spec-table{width:100%;border-collapse:collapse}
.spec-table th{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);text-align:left;padding:0 12px 7px 0;border-bottom:1.5px solid var(--border)}
.spec-table td{font-family:var(--mono);font-size:12.5px;padding:7px 12px 7px 0;border-bottom:1px solid var(--note-bg);vertical-align:middle}
.spec-table tr:last-child td{border-bottom:none}
.spec-table td.lc{color:var(--text-muted);font-family:var(--sans);font-size:12px;width:200px}
/* Swatches */
.sw-wrap{display:flex;align-items:center;gap:8px}
.sw{width:17px;height:17px;border-radius:4px;border:1px solid rgba(0,0,0,.1);flex-shrink:0;cursor:pointer;transition:transform .1s}
.sw:hover{transform:scale(1.15)}
.sw-val{cursor:pointer}
.sw-val:hover{color:var(--green)}
/* Grade table */
.gt-wrap{overflow-x:auto}
.gt{width:100%;border-collapse:collapse}
.gt th{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);text-align:center;padding:0 8px 7px;border-bottom:1.5px solid var(--border)}
.gt th:first-child{text-align:left;padding-left:0}
.gt td{font-family:var(--mono);font-size:12px;padding:7px 8px;border-bottom:1px solid var(--note-bg);text-align:center}
.gt td:first-child{text-align:left;font-family:var(--sans);color:var(--text-muted);font-size:11.5px;padding-left:0}
.gt tr:last-child td{border-bottom:none}
.gd{color:var(--green-dark);font-weight:600;background:var(--green-light);border-radius:3px;padding:1px 4px}
.gs{color:var(--text-mid)}
.gt-legend{font-size:10.5px;color:var(--text-muted);margin-top:7px;display:flex;align-items:center;gap:5px}
.ls-dot{width:9px;height:9px;border-radius:2px;background:var(--green-light);border:1px solid #a8d9be;display:inline-block}
/* Banners */
.banner{display:flex;gap:9px;align-items:flex-start;padding:8px 11px;border-radius:6px;margin-top:9px;font-size:12px;line-height:1.55}
.bw{background:var(--warn-bg);border:1px solid var(--warn-border)}
.bn{background:var(--note-bg);border:1px solid var(--note-border)}
.bi{background:var(--info-bg);border:1px solid var(--info-border)}
.b-icon{flex-shrink:0;font-size:12px;margin-top:1px}
.bt{color:var(--text-mid)}
.bt strong{color:var(--text)}
.bt code{font-family:var(--mono);font-size:11px;background:rgba(0,0,0,.06);padding:1px 4px;border-radius:3px}
.sdiv{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin:20px 0 10px;display:flex;align-items:center;gap:10px}
.sdiv::after{content:'';flex:1;height:1px;background:var(--border)}
/* Welcome */
.welcome{padding:28px;max-width:740px}
.welcome-hero{background:linear-gradient(135deg,var(--green) 0%,var(--green-dark) 100%);border-radius:12px;padding:24px 28px;margin-bottom:22px;color:white}
.welcome-hero h1{font-size:22px;font-weight:700;margin-bottom:6px}
.welcome-hero p{font-size:13px;opacity:.88;line-height:1.65;max-width:480px}
/* Subject cards */
.subject-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.subject-card{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:all .15s;box-shadow:var(--sh);position:relative;overflow:hidden}
.subject-card:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
.sc-stripe{position:absolute;top:0;left:0;right:0;height:3px;border-radius:10px 10px 0 0}
.sc-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sc-icon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.sc-name{font-size:14px;font-weight:700}
.sc-desc{font-size:11.5px;color:var(--text-muted);line-height:1.5;margin-bottom:10px}
.sc-cats{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.sc-cat-tag{font-size:10px;color:var(--text-muted);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 6px}
.sc-meta{display:flex;align-items:center;justify-content:space-between}
.sc-count{font-size:10px;font-family:var(--mono);color:var(--text-dim)}
.sc-arrow{font-size:14px;color:var(--text-dim);transition:transform .15s}
.subject-card:hover .sc-arrow{transform:translateX(3px)}
/* Welcome downloads */
.welcome-dl{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh)}
.welcome-dl-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-mid);margin-bottom:14px}
.welcome-dl-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.wdl-group-label{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;margin-bottom:7px;padding-bottom:5px;border-bottom:1.5px solid var(--border)}
.wdl-group-label.math-label{color:var(--math-color)}
.wdl-group-label.bio-label{color:var(--bio-color)}
.wdl-group-label.phys-label{color:var(--phys-color)}
.wdl-group-label.chem-label{color:var(--chem-color)}
.wdl-group-label.font-label{color:var(--text-muted)}
.wdl-sub{margin-bottom:12px}
/* Legend */
.legend-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.legend-toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;user-select:none;font-size:11px;font-weight:700;color:var(--text-mid);letter-spacing:.07em;text-transform:uppercase}
.legend-toggle:hover{background:var(--bg)}
.legend-chevron{font-size:11px;color:var(--text-dim);transition:transform .2s}
.legend-card.open .legend-chevron{transform:rotate(90deg)}
.legend-body{display:none;padding:0 16px 14px}
.legend-card.open .legend-body{display:block}
.legend-items{display:flex;flex-direction:column;gap:8px}
.legend-item{display:flex;align-items:flex-start;gap:10px;font-size:12.5px}
.li-icon{width:22px;flex-shrink:0;text-align:center;font-size:13px}
.li-desc{color:var(--text-mid);line-height:1.5}
.li-desc strong{color:var(--text)}
/* Search */
.sr{padding:20px 28px;max-width:820px}
.sr-hd{font-size:13px;color:var(--text-muted);margin-bottom:13px}
.sr-hd strong{color:var(--text)}
.ri{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:11px 14px;margin-bottom:7px;cursor:pointer;transition:all .12s;box-shadow:var(--sh)}
.ri:hover{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,133,69,.08)}
.ri-name{font-weight:600;font-size:13px;margin-bottom:4px}
.ri-meta{font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.ri-match{color:var(--green-dark);font-family:var(--mono);font-size:10.5px}
.empty{text-align:center;padding:50px 20px;color:var(--text-muted)}
.empty .ei{font-size:30px;margin-bottom:10px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:white;padding:7px 14px;border-radius:7px;font-size:12px;font-weight:500;pointer-events:none;opacity:0;transition:opacity .2s;z-index:9999}
.toast.show{opacity:1}
</style>
</head>
<body>

<div id="main"><div id="content"></div></div>

<script>
function cp(t){navigator.clipboard.writeText(t).catch(()=>{const e=document.createElement('textarea');e.value=t;document.body.appendChild(e);e.select();document.execCommand('copy');document.body.removeChild(e)});const k=document.getElementById('toast');k.textContent='Copied '+t;k.classList.add('show');setTimeout(()=>k.classList.remove('show'),1800)}
function openLightbox(src){document.getElementById('lightbox-img').src=src;document.getElementById('lightbox').classList.add('show')}
function closeLightbox(){document.getElementById('lightbox').classList.remove('show')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox()});
function swCell(hex){const c=hex.replace('#','').toUpperCase().slice(0,6),f='#'+c;return`<div class="sw-wrap"><div class="sw" style="background:${f}" onclick="cp('${f}')" title="Click to copy"></div><span class="sw-val" onclick="cp('${f}')">#${c}</span></div>`}
function sv(s){if(s.type==='color')return swCell(s.value);if(s.type==='color-inline'&&s.colorValue)return`<div class="sw-wrap"><div class="sw" style="background:${s.colorValue}" onclick="cp('${s.colorValue}')" title="Copy"></div><span>${s.value}</span></div>`;return`<span>${s.value}</span>`}
function bnr(b){const m={warn:['⚠️','bw'],note:['◆','bn'],info:['ℹ','bi']};const[ic,cl]=m[b.type];return`<div class="banner ${cl}"><span class="b-icon">${ic}</span><div class="bt">${b.text}</div></div>`}
function gTable(gt){let h=`<div class="gt-wrap"><table class="gt"><thead><tr>`;gt.columns.forEach(c=>{h+=`<th>${c}</th>`});h+=`</tr></thead><tbody>`;gt.rows.forEach(r=>{const diff=r.highlight&&new Set(r.values).size>1;h+=`<tr><td>${r.label}</td>`;r.values.forEach(v=>{let cell=v;const hm=r.type==='color'&&v.match(/#?([0-9a-fA-F]{6})/);if(hm){const hx='#'+hm[1];cell=`<div class="sw-wrap" style="justify-content:center"><div class="sw" style="background:${hx};width:13px;height:13px;cursor:pointer" onclick="cp('${hx}')" title="Copy"></div><span>${v}</span></div>`}h+=`<td><span class="${diff?'gd':'gs'}">${cell}</span></td>`});h+=`</tr>`});h+=`</tbody></table><div class="gt-legend"><span class="ls-dot"></span> Highlighted values differ across grades</div></div>`;return h}
function imgGallery(images){if(!images||!images.length)return'';return`<div class="img-gallery">${images.map(img=>`<div class="img-item"><img src="${img.src}" alt="${img.caption||''}" onclick="openLightbox('${img.src}')" loading="lazy">${img.caption?`<div class="img-caption">${img.caption}</div>`:''}</div>`).join('')}</div>`}
function dlBtn(r){return`<a href="${r.url}" target="_blank" class="dl-btn"><span class="dl-icon">${r.icon}</span>${r.label}</a>`}
function renderDlBar(subjectDownloads){
  const fontsToShow=subjectDownloads==='chemistry'?RES.fonts:RES.fonts.filter(f=>f.label!=='CMU Serif Roman');
  let h=`<div class="dl-section"><div class="dl-section-title">Downloads & Resources</div>`;
  h+=`<div class="dl-group"><div class="dl-group-label">Shared — All Subjects</div><div class="dl-row">${RES.shared.map(dlBtn).join('')}</div></div>`;
  h+=`<div class="dl-group"><div class="dl-group-label">Fonts</div><div class="dl-row">${fontsToShow.map(dlBtn).join('')}</div></div>`;
  if(subjectDownloads&&RES[subjectDownloads]&&RES[subjectDownloads].length){const lbl=subjectDownloads.charAt(0).toUpperCase()+subjectDownloads.slice(1)+' Files';h+=`<div class="dl-group"><div class="dl-group-label ${subjectDownloads}-label">${lbl}</div><div class="dl-row">${RES[subjectDownloads].map(dlBtn).join('')}</div></div>`}
  h+=`</div>`;return h;
}
function renderEl(el,accentColor){
  const pill=el.gradeVaries||el.gradeTable;
  let h=`<div class="spec-card"><div class="card-header"><span class="card-dot" style="background:${accentColor||'var(--green)'}"></span><span class="card-title">${el.label}</span>${pill?`<span class="grade-pill">grade-specific</span>`:''}</div><div class="card-body">`;
  h+=imgGallery(el.images);
  if(el.gradeTable)h+=gTable(el.gradeTable);
  if(el.specs&&el.specs.length){if(el.gradeTable)h+=`<div style="height:12px"></div>`;h+=`<table class="spec-table"><thead><tr><th>Property</th><th>Value</th></tr></thead><tbody>`;el.specs.forEach(s=>{h+=`<tr><td class="lc">${s.label}</td><td>${sv(s)}</td></tr>`});h+=`</tbody></table>`}
  if(el.banners)el.banners.forEach(b=>{h+=bnr(b)});
  h+=`</div></div>`;return h;
}
function renderPage(sid,cid){
  const sub=DATA.subjects.find(s=>s.id===sid),cat=sub.categories.find(c=>c.id===cid);
  let h=`<div class="sticky-bar"><div class="breadcrumb">${sub.label}<span style="color:var(--text-dim);font-size:10px;margin:0 2px">›</span><span>${cat.label}</span></div><span class="subject-badge badge-${sub.badge}">${sub.label}</span></div><div class="content-area">${renderDlBar(sub.downloads||'')}`;
  cat.elements.forEach((el,i)=>{if(i>0)h+=`<div class="sdiv">${el.label}</div>`;h+=renderEl(el,sub.accentColor)});
  h+=`</div>`;
  document.getElementById('content').innerHTML=h;document.getElementById('main').scrollTop=0;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const navEl=document.querySelector(`[data-key="${sid}__${cid}"]`);
  if(navEl){navEl.classList.add('active');const g=navEl.closest('.nav-group');if(g&&!g.classList.contains('open'))g.classList.add('open')}
}
function clearNav(){document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'))}
function toggleGrp(id){document.getElementById(id).classList.toggle('open')}
function buildNav(){
  let h='';
  DATA.subjects.forEach((s,i)=>{
    h+=`<div class="nav-group${i===0?' open':''}" id="ng-${s.id}"><button class="nav-group-btn" onclick="toggleGrp('ng-${s.id}')"><span class="nav-icon" style="background:${s.iconBg};color:${s.iconColor}">${s.icon}</span><span class="nav-group-label">${s.label}</span><span class="nav-group-count">${s.categories.length}</span><span class="nav-chevron">›</span></button><div class="nav-items">`;
    s.categories.forEach(c=>{const w=c.elements.some(e=>e.banners&&e.banners.some(b=>b.type==='warn'));h+=`<div class="nav-item" data-key="${s.id}__${c.id}" onclick="renderPage('${s.id}','${c.id}')">${c.label}${w?'<span class="nav-warn-dot"></span>':''}</div>`});
    h+=`</div></div>`;
  });
  document.getElementById('nav').innerHTML=h;
}
function renderWelcome(){
  const cards=DATA.subjects.map(s=>{
    const firstCat=s.categories[0].id;
    const cats=s.categories.slice(0,3).map(c=>`<span class="sc-cat-tag">${c.label}</span>`).join('');
    const more=s.categories.length>3?`<span class="sc-cat-tag" style="color:var(--text-dim)">+${s.categories.length-3} more</span>`:'';
    return`<div class="subject-card" onclick="renderPage('${s.id}','${firstCat}')"><div class="sc-stripe" style="background:${s.accentColor}"></div><div class="sc-header"><div class="sc-icon" style="background:${s.iconBg};color:${s.iconColor}">${s.icon}</div><div class="sc-name" style="color:${s.accentColor}">${s.label}</div></div><div class="sc-desc">${s.description}</div><div class="sc-cats">${cats}${more}</div><div class="sc-meta"><span class="sc-count">${s.categories.length} categories</span><span class="sc-arrow">→</span></div></div>`;
  }).join('');

  const wdl=`<div class="welcome-dl"><div class="welcome-dl-title">Downloads & Resources</div><div class="welcome-dl-grid">
    <div>
      <div class="wdl-sub"><div class="wdl-group-label math-label">Math / Shared</div><div class="dl-row">${RES.shared.map(dlBtn).join('')}</div></div>
      <div class="wdl-sub"><div class="wdl-group-label bio-label">Biology</div><div class="dl-row">${RES.biology.map(dlBtn).join('')}</div></div>
      <div class="wdl-sub"><div class="wdl-group-label font-label">Fonts</div><div class="dl-row">${RES.fonts.map(dlBtn).join('')}</div></div>
    </div>
    <div>
      <div class="wdl-sub"><div class="wdl-group-label phys-label">Physics</div><div class="dl-row">${RES.physics.map(dlBtn).join('')}</div></div>
      <div class="wdl-sub"><div class="wdl-group-label chem-label">Chemistry</div><div class="dl-row">${RES.chemistry.map(dlBtn).join('')}</div></div>
    </div>
  </div></div>`;

  const legend=`<div class="legend-card" id="legend-card"><div class="legend-toggle" onclick="document.getElementById('legend-card').classList.toggle('open')"><span>How to read this guide</span><span class="legend-chevron">›</span></div><div class="legend-body"><div class="legend-items">
    <div class="legend-item"><span class="li-icon">⚠️</span><div class="li-desc"><strong>Warning</strong> — important rule or updated guideline. Old assets may not match.</div></div>
    <div class="legend-item"><span class="li-icon">ℹ</span><div class="li-desc"><strong>Info</strong> — clarification, formula, or cross-reference to another resource.</div></div>
    <div class="legend-item"><span class="li-icon">◆</span><div class="li-desc"><strong>Note</strong> — additional context or exception to the main rule.</div></div>
    <div class="legend-item"><span class="li-icon" style="font-size:9px;background:var(--green-light);color:var(--green-dark);padding:2px 5px;border-radius:3px;font-family:var(--mono);font-weight:600;line-height:2">grade-specific</span><div class="li-desc" style="margin-left:4px"><strong>Grade-specific</strong> — values differ by grade. Check the grade comparison table.</div></div>
    <div class="legend-item"><span class="li-icon">🎨</span><div class="li-desc"><strong>Click any color swatch or hex value</strong> to copy it to clipboard.</div></div>
    <div class="legend-item"><span class="li-icon">🔍</span><div class="li-desc"><strong>Click any reference image</strong> to zoom in.</div></div>
  </div></div></div>`;

  document.getElementById('content').innerHTML=`<div class="welcome"><div class="welcome-hero"><h1>CK-12 Diagram Style Guide</h1><p>Single source of truth for all diagram specifications — for internal teams and external contractors. Pick a subject to get started.</p></div><div class="subject-cards">${cards}</div>${wdl}${legend}</div>`;
}
function doSearch(q){
  const query=q.toLowerCase().trim();
  document.getElementById('sclear').classList.toggle('vis',q.length>0);
  if(!query){renderWelcome();document.querySelectorAll('.nav-group').forEach(g=>g.classList.remove('nh'));document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('nh','active'));return}
  const res=[];
  DATA.subjects.forEach(s=>s.categories.forEach(c=>c.elements.forEach(e=>{
    let ok=false,mt='';const ck=str=>str&&str.toLowerCase().includes(query);
    if(ck(e.label)){ok=true;mt=e.label}
    if(!ok&&ck(c.label)){ok=true;mt=c.label}
    if(!ok&&e.specs)e.specs.forEach(sp=>{if(ck(sp.label)||ck(sp.value)){ok=true;mt=`${sp.label}: ${sp.value}`}});
    if(!ok&&e.gradeTable)e.gradeTable.rows.forEach(r=>{if(ck(r.label)||r.values.some(v=>ck(v))){ok=true;mt=r.label}});
    if(!ok&&e.banners)e.banners.forEach(b=>{if(ck(b.text.replace(/<[^>]+>/g,''))){ok=true;mt=b.text.replace(/<[^>]+>/g,'').slice(0,70)}});
    if(ok)res.push({s,c,e,mt});
  })));
  document.querySelectorAll('.nav-group').forEach(g=>{const sid=g.id.replace('ng-','');const vis=res.some(r=>r.s.id===sid);g.classList.toggle('nh',!vis);if(vis&&!g.classList.contains('open'))g.classList.add('open')});
  document.querySelectorAll('.nav-item').forEach(n=>{n.classList.toggle('nh',!res.some(r=>`${r.s.id}__${r.c.id}`===n.dataset.key))});
  let h=`<div class="sr"><div class="sr-hd"><strong>${res.length} result${res.length!==1?'s':''}</strong> for "${q}"</div>`;
  if(!res.length){h+=`<div class="empty"><div class="ei">🔍</div><p>No specs found. Try a color code, element name, or px value.</p></div>`}
  else{res.forEach(r=>{h+=`<div class="ri" onclick="renderPage('${r.s.id}','${r.c.id}')"><div class="ri-name">${r.e.label}</div><div class="ri-meta"><span class="subject-badge badge-${r.s.badge}" style="font-size:9px;padding:2px 6px">${r.s.label}</span>›${r.c.label}·<span class="ri-match">${r.mt.slice(0,60)}</span></div></div>`})}
  h+=`</div>`;document.getElementById('content').innerHTML=h;
}
buildNav();renderWelcome();
const si=document.getElementById('search-input');
si.addEventListener('input',e=>doSearch(e.target.value));
document.getElementById('sclear').addEventListener('click',()=>{si.value='';doSearch('');si.focus()});
</script>
</body>
</html>
