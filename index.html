<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CK-12 Diagram Style Guide</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ── */
:root {
  --green:#008545; --green-dark:#005D30; --green-light:#e8f5ee; --green-pale:#f2faf6;
  --indigo:#5750E3; --indigo-dark:#3D389F; --indigo-light:#eeeeff;
  --orange:#FF7B00; --orange-dark:#B25600; --orange-light:#fff5e6;
  --bg:#f4f5f7; --surface:#fff; --surface2:#f0f1f4;
  --border:#e3e5ea; --border2:#c8cdd7;
  /* CONTRAST-FIXED: was #737885 (fails) → now #5f6472 (6.1:1 on white ✓) */
  --text:#1a1d23; --text-mid:#44485a; --text-muted:#5f6472; --text-dim:#9ba0ad;
  --warn-bg:#fff5e6; --warn-border:#ffd9a8;
  --info-bg:#eeeeff; --info-border:#c5c3f5;
  --note-bg:#f6f7f9; --note-border:#e3e5ea;
  --math-color:#008545; --math-bg:#e8f5ee;
  --bio-color:#00783E;  --bio-bg:#e0f2e9;
  --phys-color:#5750E3; --phys-bg:#eeeeff;
  --chem-color:#B25600; --chem-bg:#fff5e6;
  /* Font scale — 4 sizes only */
  --text-xs:10px; --text-sm:12px; --text-base:13px; --text-lg:16px;
  --mono:'DM Mono',monospace; --sans:'DM Sans',sans-serif;
  --r:8px; --sh:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04); --sh-md:0 4px 12px rgba(0,0,0,.09);
}

/* ── RESET ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{background:var(--bg);color:var(--text);font-family:var(--sans);height:100vh;display:flex;overflow:hidden}

/* ── REDUCED MOTION ── */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
}

/* ── SKIP LINK ── */
.skip-link{position:absolute;top:-100%;left:16px;background:var(--green);color:#fff;padding:8px 14px;border-radius:0 0 var(--r) var(--r);font-size:var(--text-sm);font-weight:600;text-decoration:none;z-index:9999;transition:top .15s}
.skip-link:focus{top:0}

/* ── FOCUS RING ── */
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:3px}
button:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:4px}

/* ── SR-ONLY ── */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ── SIDEBAR ── */
#sidebar{width:268px;min-width:268px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--sh)}
.sidebar-brand{padding:14px 16px 12px;border-bottom:1px solid var(--border)}
.brand-logo{display:flex;align-items:center;gap:10px;margin-bottom:6px;cursor:pointer;text-decoration:none;border-radius:6px}
.brand-logo:hover .brand-title{color:var(--green)}
.brand-title{font-size:var(--text-base);font-weight:700;color:var(--text);line-height:1.2;transition:color .15s}
.brand-sub{font-size:11px;color:var(--text-muted)}
.brand-version{display:inline-block;font-size:var(--text-xs);font-family:var(--mono);background:var(--green-light);color:var(--green-dark);padding:2px 7px;border-radius:10px;margin-top:5px}

/* ── SEARCH ── */
.search-wrap{padding:10px 12px;border-bottom:1px solid var(--border);position:relative}
.search-icon{position:absolute;left:22px;top:50%;transform:translateY(-50%);color:var(--text-dim);pointer-events:none;font-size:14px;aria-hidden:true}
#search-input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--sans);font-size:var(--text-sm);padding:7px 28px 7px 30px;outline:none;transition:border-color .15s,box-shadow .15s}
#search-input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,133,69,.12);outline:none}
#search-input::placeholder{color:var(--text-dim)}
#sclear{position:absolute;right:20px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:10px;display:none;width:16px;height:16px;border-radius:50%;background:var(--border2);border:none;color:var(--text-mid);align-items:center;justify-content:center;line-height:1;padding:0}
#sclear.vis{display:flex}
#sclear:hover{background:var(--green);color:#fff}

/* ── NAV ── */
#nav{overflow-y:auto;flex:1;padding:6px 0 16px}
#nav::-webkit-scrollbar{width:3px}
#nav::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.nav-group{margin-bottom:1px}
.nav-group-btn{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:background .1s;border-radius:0}
.nav-group-btn:hover{background:var(--bg)}
.nav-icon{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;font-weight:700;pointer-events:none}
.nav-group-label{font-size:var(--text-sm);font-weight:600;color:var(--text-mid);flex:1;text-align:left}
.nav-group-count{font-size:var(--text-xs);color:var(--text-dim);font-family:var(--mono)}
.nav-chevron{font-size:10px;color:var(--text-dim);transition:transform .2s;margin-left:2px;pointer-events:none}
.nav-group.open .nav-chevron{transform:rotate(90deg)}
.nav-items{display:none}
.nav-group.open .nav-items{display:block}
/* Nav items are now buttons for keyboard access */
.nav-item{display:flex;align-items:center;gap:6px;padding:5px 14px 5px 44px;cursor:pointer;color:var(--text-muted);font-size:var(--text-sm);border:none;border-left:3px solid transparent;background:none;width:100%;text-align:left;transition:all .1s;font-family:var(--sans)}
.nav-item:hover{color:var(--text);background:var(--bg)}
.nav-item.active{color:var(--green);border-left-color:var(--green);background:var(--green-pale);font-weight:600}
.nav-warn-dot{width:5px;height:5px;border-radius:50%;background:var(--orange);margin-left:auto;flex-shrink:0}
.nav-item.nh,.nav-group.nh{display:none}

/* ── MAIN ── */
#main{flex:1;overflow-y:auto;position:relative}
#main::-webkit-scrollbar{width:5px}
#main::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── STICKY BAR ── */
.sticky-bar{position:sticky;top:0;z-index:20;background:rgba(244,245,247,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:10px 28px;display:flex;align-items:center;gap:10px}
.breadcrumb{font-size:var(--text-sm);color:var(--text-muted);display:flex;align-items:center;gap:5px;flex:1}
.breadcrumb span{color:var(--text);font-weight:600}
.subject-badge{font-size:var(--text-xs);font-weight:600;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
.badge-math    {background:var(--math-bg); color:var(--math-color)}
.badge-biology {background:var(--bio-bg);  color:var(--bio-color)}
.badge-physics {background:var(--phys-bg); color:var(--phys-color)}
.badge-chemistry{background:var(--chem-bg);color:var(--chem-color)}

/* ── RESOURCES BUTTON & DROPDOWN ── */
.res-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:6px;font-size:var(--text-sm);font-weight:500;font-family:var(--sans);cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--text-mid);transition:all .15s;white-space:nowrap}
.res-btn:hover,.res-btn.open{background:var(--green-light);border-color:var(--green);color:var(--green-dark)}
.res-btn .res-arrow{font-size:10px;transition:transform .2s}
.res-btn.open .res-arrow{transform:rotate(180deg)}
.res-dropdown{display:none;position:fixed;top:48px;right:28px;width:440px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh-md);z-index:50;padding:14px 16px;max-height:80vh;overflow-y:auto}
.res-dropdown.show{display:block}
.res-dropdown-title{font-size:var(--text-xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-mid);margin-bottom:12px}
.res-group{margin-bottom:12px}
.res-group:last-child{margin-bottom:0}
.res-group-label{font-size:var(--text-xs);font-weight:600;letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px;padding-bottom:4px;border-bottom:1.5px solid var(--border)}
.res-group-label.math-label{color:var(--math-color)}
.res-group-label.bio-label{color:var(--bio-color)}
.res-group-label.phys-label{color:var(--phys-color)}
.res-group-label.chem-label{color:var(--chem-color)}
.res-group-label.font-label{color:var(--text-muted)}

/* ── DOWNLOAD BUTTONS ── */
.dl-row{display:flex;flex-wrap:wrap;gap:5px}
.dl-btn{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:6px;font-size:var(--text-sm);font-weight:500;font-family:var(--sans);cursor:pointer;text-decoration:none;border:1.5px solid var(--border);background:var(--surface);color:var(--text-mid);transition:all .15s;white-space:nowrap}
.dl-btn:hover{background:var(--bg);border-color:var(--border2);color:var(--text)}
.dl-icon{font-size:13px;flex-shrink:0}

/* ── CONTENT ── */
.content-area{padding:22px 28px 60px;max-width:820px}

/* ── CARDS ── */
.spec-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden;box-shadow:var(--sh)}
/* NO hover shadow — cards are not interactive */
.card-header{padding:11px 16px 9px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.card-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.card-title{font-size:var(--text-base);font-weight:600;flex:1}
.grade-pill{font-size:var(--text-xs);font-family:var(--mono);font-weight:500;padding:2px 6px;border-radius:3px;border:1px solid}
.card-body{padding:13px 16px}

/* ── IMAGES ── */
.img-gallery{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.img-item{display:flex;flex-direction:column;gap:5px}
/* Image buttons for keyboard access */
.img-btn{border:none;padding:0;background:none;cursor:zoom-in;border-radius:6px;display:block}
.img-btn:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.img-item img{border-radius:6px;border:1px solid var(--border);object-fit:contain;background:var(--surface2);max-width:340px;max-height:220px;display:block;transition:opacity .15s}
.img-btn:hover img{opacity:.92}
.img-caption{font-size:var(--text-xs);color:var(--text-muted);text-align:center;font-style:italic}

/* ── LIGHTBOX ── */
#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:1000;align-items:center;justify-content:center}
#lightbox.show{display:flex}
#lightbox img{max-width:90vw;max-height:90vh;border-radius:8px;object-fit:contain}
#lightbox-close{position:absolute;top:20px;right:24px;color:white;font-size:28px;cursor:pointer;line-height:1;background:none;border:none;padding:4px 8px;border-radius:6px}
#lightbox-close:focus-visible{outline:2px solid white;outline-offset:2px}

/* ── SPEC TABLE ── */
.spec-table{width:100%;border-collapse:collapse}
.spec-table th{font-size:var(--text-xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);text-align:left;padding:0 12px 7px 0;border-bottom:1.5px solid var(--border)}
.spec-table td{font-size:var(--text-sm);padding:7px 12px 7px 0;border-bottom:1px solid var(--note-bg);vertical-align:middle}
.spec-table tr:last-child td{border-bottom:none}
.spec-table td.lc{color:var(--text-muted);font-family:var(--sans);font-size:var(--text-sm);width:200px}
/* Value cells get monospace for spec data */
.spec-table td:not(.lc){font-family:var(--mono)}

/* ── COLOR SWATCH ── */
.sw-wrap{display:flex;align-items:center;gap:8px}
/* Swatch is now a button */
.sw-btn{border:none;padding:0;background:none;cursor:pointer;display:flex;align-items:center;gap:8px;border-radius:4px;font-family:var(--mono);font-size:var(--text-sm);color:inherit;transition:color .1s}
.sw-btn:hover{color:var(--green)}
.sw{width:17px;height:17px;border-radius:4px;border:1px solid rgba(0,0,0,.1);flex-shrink:0;transition:transform .1s;display:block}
.sw-btn:hover .sw{transform:scale(1.15)}

/* ── GRADE TABLE ── */
.grade-legend-bar{display:flex;align-items:center;gap:6px;font-size:var(--text-xs);color:var(--text-muted);margin-bottom:10px;padding:7px 10px;background:var(--surface2);border-radius:5px;border:1px solid var(--border)}
.ls-dot{width:9px;height:9px;border-radius:2px;background:var(--green-light);border:1px solid #a8d9be;display:inline-block;flex-shrink:0}
.gt-wrap{overflow-x:auto}
.gt{width:100%;border-collapse:collapse}
.gt th{font-size:var(--text-xs);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);text-align:center;padding:0 8px 7px;border-bottom:1.5px solid var(--border)}
.gt th:first-child{text-align:left;padding-left:0}
.gt td{font-family:var(--mono);font-size:var(--text-sm);padding:7px 8px;border-bottom:1px solid var(--note-bg);text-align:center}
.gt td:first-child{text-align:left;font-family:var(--sans);color:var(--text-muted);font-size:var(--text-sm);padding-left:0}
.gt tr:last-child td{border-bottom:none}
.gd{color:var(--green-dark);font-weight:600;background:var(--green-light);border-radius:3px;padding:1px 4px}
.gs{color:var(--text-mid)}

/* ── BANNERS ── */
.banner{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:6px;margin-top:9px;font-size:var(--text-sm);line-height:1.55}
.bw{background:var(--warn-bg);border:1px solid var(--warn-border)}
.bn{background:var(--note-bg);border:1px solid var(--note-border)}
.bi{background:var(--info-bg);border:1px solid var(--info-border)}
/* Consistent icon treatment — CSS circles */
.b-icon{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px;line-height:1}
.bw .b-icon{background:#e07b00;color:#fff}
.bn .b-icon{background:var(--border2);color:var(--text-mid)}
.bi .b-icon{background:var(--indigo);color:#fff}
.bt{color:var(--text-mid);flex:1}
.bt strong{color:var(--text)}
.bt code{font-family:var(--mono);font-size:11px;background:rgba(0,0,0,.06);padding:1px 4px;border-radius:3px}

/* ── SECTION DIVIDER ── */
.sdiv{font-size:var(--text-xs);font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin:20px 0 10px;display:flex;align-items:center;gap:10px}
.sdiv::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── WELCOME ── */
.welcome{padding:28px;max-width:740px}
.welcome-hero{background:linear-gradient(135deg,var(--green) 0%,var(--green-dark) 100%);border-radius:12px;padding:24px 28px;margin-bottom:22px;color:white}
.welcome-hero h1{font-size:22px;font-weight:700;margin-bottom:6px}
.welcome-hero p{font-size:13px;opacity:.9;line-height:1.65;max-width:480px}

/* Subject cards — buttons for accessibility */
.subject-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.subject-card{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:box-shadow .15s,transform .15s;box-shadow:var(--sh);position:relative;overflow:hidden;text-align:left;font-family:var(--sans);width:100%}
.subject-card:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
.subject-card:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.sc-stripe{position:absolute;top:0;left:0;right:0;height:3px;border-radius:10px 10px 0 0}
.sc-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sc-icon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.sc-name{font-size:14px;font-weight:700}
.sc-desc{font-size:11.5px;color:var(--text-muted);line-height:1.5;margin-bottom:10px}
.sc-cats{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.sc-cat-tag{font-size:var(--text-xs);color:var(--text-muted);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 6px}
.sc-meta{display:flex;align-items:center;justify-content:space-between}
.sc-count{font-size:var(--text-xs);font-family:var(--mono);color:var(--text-dim)}
.sc-arrow{font-size:14px;color:var(--text-dim);transition:transform .15s}
.subject-card:hover .sc-arrow{transform:translateX(3px)}

/* Welcome downloads */
.welcome-dl{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh)}
.welcome-dl-title{font-size:var(--text-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-mid);margin-bottom:14px}
.welcome-dl-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.wdl-sub{margin-bottom:12px}
.wdl-sub:last-child{margin-bottom:0}
.wdl-group-label{font-size:var(--text-xs);font-weight:600;letter-spacing:.07em;text-transform:uppercase;margin-bottom:7px;padding-bottom:4px;border-bottom:1.5px solid var(--border)}
.wdl-group-label.math-label{color:var(--math-color)}
.wdl-group-label.bio-label{color:var(--bio-color)}
.wdl-group-label.phys-label{color:var(--phys-color)}
.wdl-group-label.chem-label{color:var(--chem-color)}
.wdl-group-label.font-label{color:var(--text-muted)}

/* Legend collapsible */
.legend-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.legend-toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;font-size:var(--text-xs);font-weight:700;color:var(--text-mid);letter-spacing:.07em;text-transform:uppercase;border:none;background:none;width:100%;text-align:left;font-family:var(--sans)}
.legend-toggle:hover{background:var(--bg)}
.legend-chevron{font-size:11px;color:var(--text-dim);transition:transform .2s}
.legend-card.open .legend-chevron{transform:rotate(90deg)}
.legend-body{display:none;padding:0 16px 14px}
.legend-card.open .legend-body{display:block}
.legend-items{display:flex;flex-direction:column;gap:9px}
.legend-item{display:flex;align-items:flex-start;gap:10px;font-size:13px}
.li-icon{width:22px;flex-shrink:0;text-align:center;font-size:13px}
.li-desc{color:var(--text-mid);line-height:1.5}
.li-desc strong{color:var(--text)}

/* Search results */
.sr{padding:20px 28px;max-width:820px}
.sr-hd{font-size:var(--text-base);color:var(--text-muted);margin-bottom:13px}
.sr-hd strong{color:var(--text)}
/* Search result items are buttons */
.ri{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:11px 14px;margin-bottom:7px;cursor:pointer;transition:border-color .12s,box-shadow .12s;box-shadow:var(--sh);text-align:left;width:100%;font-family:var(--sans)}
.ri:hover{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,133,69,.08)}
.ri-name{font-weight:600;font-size:var(--text-base);margin-bottom:4px;color:var(--text)}
.ri-meta{font-size:var(--text-xs);color:var(--text-muted);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.ri-match{color:var(--green-dark);font-family:var(--mono);font-size:var(--text-xs)}
.empty{text-align:center;padding:50px 20px;color:var(--text-muted)}
.empty .ei{font-size:30px;margin-bottom:10px}

/* Toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:white;padding:7px 14px;border-radius:7px;font-size:var(--text-sm);font-weight:500;pointer-events:none;opacity:0;transition:opacity .2s;z-index:9999;role:status;aria-live:polite}
.toast.show{opacity:1}
</style>
</head>
<body>

<!-- Skip link for keyboard users -->
<a href="#main" class="skip-link">Skip to main content</a>

<!-- Lightbox -->
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Image preview">
  <button id="lightbox-close" onclick="closeLightbox()" aria-label="Close image preview">×</button>
  <img id="lightbox-img" src="" alt="">
</div>

<div id="sidebar">
  <div class="sidebar-brand">
    <a class="brand-logo" href="#" onclick="renderWelcome();clearNav();return false;" aria-label="CK-12 Diagram Style Guide — Go to home">

<!-- Resources dropdown panel -->
<div id="res-dropdown" class="res-dropdown" role="region" aria-label="Downloads and resources"></div>

<script src="specs.js"></script>
<script>
/* ── HELPERS ── */
function cp(text) {
  navigator.clipboard.writeText(text).catch(() => {
    const el = document.createElement('textarea');
    el.value = text; document.body.appendChild(el);
    el.select(); document.execCommand('copy'); document.body.removeChild(el);
  });
  const t = document.getElementById('toast');
  t.textContent = 'Copied ' + text; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

/* Lightbox — with focus trap */
let lastFocusedEl = null;
function openLightbox(src, alt) {
  lastFocusedEl = document.activeElement;
  const lb = document.getElementById('lightbox');
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox-img').alt = alt || 'Reference image';
  lb.classList.add('show');
  document.getElementById('lightbox-close').focus();
  document.addEventListener('keydown', lbKeyHandler);
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
  document.removeEventListener('keydown', lbKeyHandler);
  if (lastFocusedEl) lastFocusedEl.focus();
}
function lbKeyHandler(e) {
  if (e.key === 'Escape') closeLightbox();
}
document.getElementById('lightbox').addEventListener('click', function(e) {
  if (e.target === this) closeLightbox();
});

/* ── SWATCH ── */
function swBtn(hex) {
  const c = hex.replace('#','').toUpperCase().slice(0,6), f = '#'+c;
  return `<button class="sw-btn" onclick="cp('${f}')" aria-label="Copy color ${f}">
    <span class="sw" style="background:${f}" aria-hidden="true"></span>
    <span>#${c}</span>
  </button>`;
}

function sv(s) {
  if (s.type === 'color') return swBtn(s.value);
  if (s.type === 'color-inline' && s.colorValue)
    return `<div class="sw-wrap">${swBtn(s.colorValue).replace('</button>', `</span> <span style="font-family:var(--mono)">${s.value}</span></button>`)}</div>`;
  return `<span style="font-family:var(--mono)">${s.value}</span>`;
}

/* Fix color-inline rendering properly */
function svClean(s) {
  if (s.type === 'color') return swBtn(s.value);
  if (s.type === 'color-inline' && s.colorValue) {
    const c = s.colorValue.replace('#','').toUpperCase().slice(0,6), f = '#'+c;
    return `<button class="sw-btn" onclick="cp('${f}')" aria-label="Copy color ${f}">
      <span class="sw" style="background:${f}" aria-hidden="true"></span>
      <span>${s.value}</span>
    </button>`;
  }
  return `<span style="font-family:var(--mono)">${s.value}</span>`;
}

/* ── BANNERS ── */
function bnr(b) {
  const icons = { warn:'!', note:'•', info:'i' };
  const cls   = { warn:'bw', note:'bn', info:'bi' };
  return `<div class="banner ${cls[b.type]}" role="${b.type==='warn'?'alert':'note'}">
    <span class="b-icon" aria-hidden="true">${icons[b.type]}</span>
    <div class="bt">${b.text}</div>
  </div>`;
}

/* ── GRADE TABLE (no legend inside — shown once per page) ── */
function gTable(gt) {
  let h = `<div class="gt-wrap"><table class="gt" role="table">
    <thead><tr>`;
  gt.columns.forEach(c => { h += `<th scope="col">${c}</th>`; });
  h += `</tr></thead><tbody>`;
  gt.rows.forEach(r => {
    const diff = r.highlight && new Set(r.values).size > 1;
    h += `<tr><th scope="row" style="text-align:left;font-family:var(--sans);color:var(--text-muted);font-size:var(--text-sm);padding:7px 8px 7px 0;font-weight:400;border-bottom:1px solid var(--note-bg)">${r.label}</th>`;
    r.values.forEach(v => {
      let cell = v;
      const hm = r.type === 'color' && v.match(/#?([0-9a-fA-F]{6})/);
      if (hm) {
        const hx = '#' + hm[1];
        cell = `<button class="sw-btn" style="justify-content:center" onclick="cp('${hx}')" aria-label="Copy ${hx}">
          <span class="sw" style="background:${hx};width:13px;height:13px" aria-hidden="true"></span>
          <span>${v}</span>
        </button>`;
      }
      h += `<td style="border-bottom:1px solid var(--note-bg)"><span class="${diff?'gd':'gs'}">${cell}</span></td>`;
    });
    h += `</tr>`;
  });
  h += `</tbody></table></div>`;
  return h;
}

/* ── IMAGES ── */
function imgGallery(images) {
  if (!images || !images.length) return '';
  return `<div class="img-gallery" role="list">${images.map(img =>
    `<div class="img-item" role="listitem">
      <button class="img-btn" onclick="openLightbox('${img.src}','${img.caption||''}')" aria-label="View larger: ${img.caption||'reference image'}">
        <img src="${img.src}" alt="${img.caption||'Style guide reference image'}" loading="lazy">
      </button>
      ${img.caption ? `<div class="img-caption">${img.caption}</div>` : ''}
    </div>`
  ).join('')}</div>`;
}

/* ── DOWNLOAD BUTTON ── */
function dlBtn(r) {
  return `<a href="${r.url}" target="_blank" rel="noopener" class="dl-btn" aria-label="Open ${r.label} (opens in new tab)">
    <span class="dl-icon" aria-hidden="true">${r.icon}</span>${r.label}
  </a>`;
}

/* ── RESOURCES DROPDOWN ── */
function buildResDropdown(subjectDownloads) {
  const fontsToShow = subjectDownloads === 'chemistry'
    ? RES.fonts
    : RES.fonts.filter(f => f.label !== 'CMU Serif Roman');

  let h = `<div class="res-dropdown-title">Downloads & Resources</div>`;
  h += `<div class="res-group"><div class="res-group-label">Shared — All Subjects</div><div class="dl-row">${RES.shared.map(dlBtn).join('')}</div></div>`;
  h += `<div class="res-group"><div class="res-group-label font-label">Fonts</div><div class="dl-row">${fontsToShow.map(dlBtn).join('')}</div></div>`;
  if (subjectDownloads && RES[subjectDownloads] && RES[subjectDownloads].length) {
    const lbl = subjectDownloads.charAt(0).toUpperCase() + subjectDownloads.slice(1) + ' Files';
    h += `<div class="res-group"><div class="res-group-label ${subjectDownloads}-label">${lbl}</div><div class="dl-row">${RES[subjectDownloads].map(dlBtn).join('')}</div></div>`;
  }
  document.getElementById('res-dropdown').innerHTML = h;
}

let resDropdownOpen = false;
function toggleResDropdown(subjectDownloads) {
  const btn = document.getElementById('res-toggle-btn');
  const panel = document.getElementById('res-dropdown');
  resDropdownOpen = !resDropdownOpen;
  if (resDropdownOpen) {
    buildResDropdown(subjectDownloads);
    panel.classList.add('show');
    btn.classList.add('open');
    btn.setAttribute('aria-expanded', 'true');
  } else {
    closeResDropdown();
  }
}
function closeResDropdown() {
  resDropdownOpen = false;
  document.getElementById('res-dropdown').classList.remove('show');
  const btn = document.getElementById('res-toggle-btn');
  if (btn) { btn.classList.remove('open'); btn.setAttribute('aria-expanded','false'); }
}
document.addEventListener('click', function(e) {
  const btn = document.getElementById('res-toggle-btn');
  const panel = document.getElementById('res-dropdown');
  if (resDropdownOpen && btn && panel && !btn.contains(e.target) && !panel.contains(e.target)) {
    closeResDropdown();
  }
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && resDropdownOpen) closeResDropdown();
});

/* ── RENDER ELEMENT ── */
function renderEl(el, accentColor, subjectBadge) {
  const hasGradeTable = !!el.gradeTable;
  const pill = el.gradeVaries || hasGradeTable;

  /* Grade pill color follows subject */
  const pillColors = {
    math:     { bg:'var(--math-bg)',  color:'var(--math-color)',  border:'#a8d9be' },
    biology:  { bg:'var(--bio-bg)',   color:'var(--bio-color)',   border:'#8fcfb0' },
    physics:  { bg:'var(--phys-bg)',  color:'var(--phys-color)',  border:'#b8b6ef' },
    chemistry:{ bg:'var(--chem-bg)',  color:'var(--chem-color)',  border:'#ffc580' },
  };
  const pc = pillColors[subjectBadge] || pillColors.math;

  let h = `<div class="spec-card">
    <div class="card-header">
      <span class="card-dot" style="background:${accentColor}" aria-hidden="true"></span>
      <h3 class="card-title">${el.label}</h3>
      ${pill ? `<span class="grade-pill" style="background:${pc.bg};color:${pc.color};border-color:${pc.border}">grade-specific</span>` : ''}
    </div>
    <div class="card-body">`;

  h += imgGallery(el.images);
  if (hasGradeTable) h += gTable(el.gradeTable);

  if (el.specs && el.specs.length) {
    if (hasGradeTable) h += `<div style="height:12px"></div>`;
    h += `<table class="spec-table" role="table">
      <thead><tr><th scope="col">Property</th><th scope="col">Value</th></tr></thead>
      <tbody>`;
    el.specs.forEach(s => {
      h += `<tr><td class="lc">${s.label}</td><td>${svClean(s)}</td></tr>`;
    });
    h += `</tbody></table>`;
  }

  if (el.banners) el.banners.forEach(b => { h += bnr(b); });
  h += `</div></div>`;
  return h;
}

/* ── RENDER PAGE ── */
function renderPage(sid, cid) {
  closeResDropdown();
  const sub = DATA.subjects.find(s => s.id === sid);
  const cat = sub.categories.find(c => c.id === cid);

  /* Check if any element in this category has a grade table — show legend once */
  const hasAnyGradeTable = cat.elements.some(e => e.gradeTable);

  let h = `<div class="sticky-bar">
    <div class="breadcrumb" aria-label="Current location">
      <span>${sub.label}</span>
      <span style="color:var(--text-dim);font-size:10px" aria-hidden="true">›</span>
      <span aria-current="page">${cat.label}</span>
    </div>
    <span class="subject-badge badge-${sub.badge}" aria-label="Subject: ${sub.label}">${sub.label}</span>
    <button id="res-toggle-btn" class="res-btn" onclick="toggleResDropdown('${sub.downloads||''}')"
      aria-expanded="false" aria-controls="res-dropdown" aria-haspopup="true">
      Resources <span class="res-arrow" aria-hidden="true">▾</span>
    </button>
  </div>
  <div class="content-area">`;

  /* Grade table legend — shown ONCE at top if any grade table exists */
  if (hasAnyGradeTable) {
    h += `<div class="grade-legend-bar" role="note">
      <span class="ls-dot" aria-hidden="true"></span>
      <span>Cells highlighted in green differ across grades</span>
    </div>`;
  }

  cat.elements.forEach((el, i) => {
    if (i > 0) h += `<div class="sdiv" aria-hidden="true">${el.label}</div>`;
    h += renderEl(el, sub.accentColor, sub.badge);
  });

  h += `</div>`;
  document.getElementById('content').innerHTML = h;
  document.getElementById('main').scrollTop = 0;

  /* Update active nav */
  document.querySelectorAll('.nav-item').forEach(n => {
    const isCurrent = n.dataset.key === `${sid}__${cid}`;
    n.classList.toggle('active', isCurrent);
    n.setAttribute('aria-current', isCurrent ? 'page' : 'false');
  });

  /* Open parent group */
  const navEl = document.querySelector(`[data-key="${sid}__${cid}"]`);
  if (navEl) {
    const g = navEl.closest('.nav-group');
    if (g && !g.classList.contains('open')) {
      g.classList.add('open');
      const btn = g.querySelector('.nav-group-btn');
      if (btn) btn.setAttribute('aria-expanded', 'true');
    }
  }
}

function clearNav() {
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.remove('active');
    n.setAttribute('aria-current', 'false');
  });
}

function toggleGrp(id) {
  const g = document.getElementById(id);
  g.classList.toggle('open');
  const btn = g.querySelector('.nav-group-btn');
  btn.setAttribute('aria-expanded', g.classList.contains('open') ? 'true' : 'false');
}

/* ── BUILD NAV ── */
function buildNav() {
  let h = '';
  DATA.subjects.forEach((s, i) => {
    const groupId = `ng-${s.id}`;
    const isOpen = i === 0;
    h += `<div class="nav-group${isOpen ? ' open' : ''}" id="${groupId}">
      <button class="nav-group-btn"
        onclick="toggleGrp('${groupId}')"
        aria-expanded="${isOpen}"
        aria-controls="ni-${s.id}">
        <span class="nav-icon" style="background:${s.iconBg};color:${s.iconColor}" aria-hidden="true">${s.icon}</span>
        <span class="nav-group-label">${s.label}</span>
        <span class="nav-group-count" aria-label="${s.categories.length} categories">${s.categories.length}</span>
        <span class="nav-chevron" aria-hidden="true">›</span>
      </button>
      <div class="nav-items" id="ni-${s.id}" role="list">`;
    s.categories.forEach(c => {
      const hasWarn = c.elements.some(e => e.banners && e.banners.some(b => b.type === 'warn'));
      h += `<button class="nav-item"
        data-key="${s.id}__${c.id}"
        onclick="renderPage('${s.id}','${c.id}')"
        aria-current="false"
        role="listitem">
        ${c.label}
        ${hasWarn ? `<span class="nav-warn-dot" aria-label="Contains warnings" title="Contains warnings"></span>` : ''}
      </button>`;
    });
    h += `</div></div>`;
  });
  document.getElementById('nav').innerHTML = h;
}

/* ── WELCOME ── */
function renderWelcome() {
  closeResDropdown();

  const cards = DATA.subjects.map(s => {
    const firstCat = s.categories[0].id;
    const cats = s.categories.slice(0, 3).map(c =>
      `<span class="sc-cat-tag">${c.label}</span>`).join('');
    const more = s.categories.length > 3
      ? `<span class="sc-cat-tag" style="color:var(--text-dim)">+${s.categories.length - 3} more</span>` : '';
    return `<button class="subject-card" onclick="renderPage('${s.id}','${firstCat}')" aria-label="Open ${s.label} style guide">
      <span class="sc-stripe" style="background:${s.accentColor}" aria-hidden="true"></span>
      <div class="sc-header">
        <span class="sc-icon" style="background:${s.iconBg};color:${s.iconColor}" aria-hidden="true">${s.icon}</span>
        <span class="sc-name" style="color:${s.accentColor}">${s.label}</span>
      </div>
      <div class="sc-desc">${s.description}</div>
      <div class="sc-cats" aria-hidden="true">${cats}${more}</div>
      <div class="sc-meta">
        <span class="sc-count">${s.categories.length} categories</span>
        <span class="sc-arrow" aria-hidden="true">→</span>
      </div>
    </button>`;
  }).join('');

  const wdl = `<div class="welcome-dl" role="region" aria-label="Downloads and resources">
    <div class="welcome-dl-title">Downloads & Resources</div>
    <div class="welcome-dl-grid">
      <div>
        <div class="wdl-sub"><div class="wdl-group-label math-label">Math / Shared</div><div class="dl-row">${RES.shared.map(dlBtn).join('')}</div></div>
        <div class="wdl-sub"><div class="wdl-group-label bio-label">Biology</div><div class="dl-row">${RES.biology.map(dlBtn).join('')}</div></div>
        <div class="wdl-sub"><div class="wdl-group-label font-label">Fonts</div><div class="dl-row">${RES.fonts.map(dlBtn).join('')}</div></div>
      </div>
      <div>
        <div class="wdl-sub"><div class="wdl-group-label phys-label">Physics</div><div class="dl-row">${RES.physics.map(dlBtn).join('')}</div></div>
        <div class="wdl-sub"><div class="wdl-group-label chem-label">Chemistry</div><div class="dl-row">${RES.chemistry.map(dlBtn).join('')}</div></div>
      </div>
    </div>
  </div>`;

  const legend = `<div class="legend-card" id="legend-card">
    <button class="legend-toggle" onclick="document.getElementById('legend-card').classList.toggle('open')"
      aria-expanded="false" aria-controls="legend-body" id="legend-toggle">
      <span>How to read this guide</span>
      <span class="legend-chevron" aria-hidden="true">›</span>
    </button>
    <div class="legend-body" id="legend-body" role="region" aria-labelledby="legend-toggle">
      <div class="legend-items">
        <div class="legend-item">
          <span class="li-icon" aria-hidden="true">⚠️</span>
          <div class="li-desc"><strong>Warning</strong> — important rule or updated guideline. Old assets may not match.</div>
        </div>
        <div class="legend-item">
          <span class="li-icon" aria-hidden="true" style="font-size:11px;font-weight:700;color:var(--indigo)">i</span>
          <div class="li-desc"><strong>Info</strong> — clarification, formula, or cross-reference to another resource.</div>
        </div>
        <div class="legend-item">
          <span class="li-icon" aria-hidden="true">•</span>
          <div class="li-desc"><strong>Note</strong> — additional context or exception to the main rule.</div>
        </div>
        <div class="legend-item">
          <span class="li-icon" style="font-size:9px;background:var(--green-light);color:var(--green-dark);padding:2px 5px;border-radius:3px;font-family:var(--mono);font-weight:600;line-height:2;width:auto" aria-hidden="true">grade-specific</span>
          <div class="li-desc" style="margin-left:4px"><strong>Grade-specific</strong> — values differ by grade. Check the grade comparison table.</div>
        </div>
        <div class="legend-item">
          <span class="li-icon" aria-hidden="true">🎨</span>
          <div class="li-desc"><strong>Click any color swatch or hex value</strong> to copy it to clipboard.</div>
        </div>
        <div class="legend-item">
          <span class="li-icon" aria-hidden="true">🔍</span>
          <div class="li-desc"><strong>Click any reference image</strong> to zoom in.</div>
        </div>
      </div>
    </div>
  </div>`;

  document.getElementById('content').innerHTML = `
    <div class="welcome">
      <div class="welcome-hero" role="banner">
        <h1>CK-12 Diagram Style Guide</h1>
        <p>Single source of truth for all diagram specifications — for internal teams and external contractors. Pick a subject below to get started.</p>
      </div>
      <div class="subject-cards" role="list" aria-label="Subjects">${cards}</div>
      ${wdl}
      ${legend}
    </div>`;

  /* Sync legend toggle aria */
  document.getElementById('legend-card').addEventListener('click', function() {
    const tog = document.getElementById('legend-toggle');
    tog.setAttribute('aria-expanded', this.classList.contains('open') ? 'true' : 'false');
  });
}

/* ── SEARCH ── */
function doSearch(q) {
  const query = q.toLowerCase().trim();
  document.getElementById('sclear').classList.toggle('vis', q.length > 0);

  if (!query) {
    renderWelcome();
    document.querySelectorAll('.nav-group').forEach(g => g.classList.remove('nh'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('nh', 'active'));
    return;
  }

  const res = [];
  DATA.subjects.forEach(s => s.categories.forEach(c => c.elements.forEach(e => {
    let ok = false, mt = '';
    const ck = str => str && str.toLowerCase().includes(query);
    if (ck(e.label)) { ok = true; mt = e.label; }
    if (!ok && ck(c.label)) { ok = true; mt = c.label; }
    if (!ok && e.specs) e.specs.forEach(sp => { if (ck(sp.label) || ck(sp.value)) { ok = true; mt = `${sp.label}: ${sp.value}`; } });
    if (!ok && e.gradeTable) e.gradeTable.rows.forEach(r => { if (ck(r.label) || r.values.some(v => ck(v))) { ok = true; mt = r.label; } });
    if (!ok && e.banners) e.banners.forEach(b => { if (ck(b.text.replace(/<[^>]+>/g, ''))) { ok = true; mt = b.text.replace(/<[^>]+>/g, '').slice(0, 70); } });
    if (ok) res.push({ s, c, e, mt });
  })));

  document.querySelectorAll('.nav-group').forEach(g => {
    const sid = g.id.replace('ng-', '');
    const vis = res.some(r => r.s.id === sid);
    g.classList.toggle('nh', !vis);
    if (vis && !g.classList.contains('open')) {
      g.classList.add('open');
      const btn = g.querySelector('.nav-group-btn');
      if (btn) btn.setAttribute('aria-expanded', 'true');
    }
  });
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('nh', !res.some(r => `${r.s.id}__${r.c.id}` === n.dataset.key));
  });

  let h = `<div class="sr" role="region" aria-label="Search results">
    <div class="sr-hd" aria-live="polite"><strong>${res.length} result${res.length !== 1 ? 's' : ''}</strong> for "${q}"</div>`;

  if (!res.length) {
    h += `<div class="empty"><div class="ei" aria-hidden="true">🔍</div><p>No specs found. Try a color code, element name, or px value.</p></div>`;
  } else {
    res.forEach(r => {
      h += `<button class="ri" onclick="renderPage('${r.s.id}','${r.c.id}')" aria-label="Go to ${r.e.label} in ${r.c.label}">
        <div class="ri-name">${r.e.label}</div>
        <div class="ri-meta">
          <span class="subject-badge badge-${r.s.badge}" style="font-size:9px;padding:2px 6px">${r.s.label}</span>
          <span aria-hidden="true">›</span> ${r.c.label}
          <span aria-hidden="true">·</span>
          <span class="ri-match">${r.mt.slice(0, 60)}</span>
        </div>
      </button>`;
    });
  }
  h += `</div>`;
  document.getElementById('content').innerHTML = h;
}

/* ── INIT ── */
buildNav();
renderWelcome();

const si = document.getElementById('search-input');
si.addEventListener('input', e => doSearch(e.target.value));
document.getElementById('sclear').addEventListener('click', () => {
  si.value = ''; doSearch(''); si.focus();
});
</script>
</body>
